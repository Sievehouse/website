<title id="t">Whose clock wins? One outage, two records</title>
<desc id="d">gpu-003 on 3 October 2026: the provider recorded 04:12 to 06:40, the tenant 04:13 to 06:41. Counting only what both saw gives 04:13 to 06:40, 8,820 seconds; counting from the provider's first fault to the tenant's recovery gives 04:12 to 06:41, 8,940 seconds.</desc>
